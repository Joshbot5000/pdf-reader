<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'"
    />
    <title>PDF Reader</title>
  </head>
  <body data-mode="home">
    <header id="titlebar">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div class="app-name">PDF Reader</div>
      <div id="doc-chip" class="doc-chip" hidden></div>
      <div id="search-slot" class="search-slot"></div>
      <div id="title-actions" class="title-actions"></div>
    </header>

    <div id="app">
      <nav id="rail" aria-label="Tools"></nav>

      <aside id="side" aria-label="Side panel">
        <div class="side-head">
          <h2 id="side-title">Pages</h2>
          <p id="side-desc"></p>
        </div>
        <div id="thumbs" class="thumbs"></div>
        <div id="side-body" class="side-body"></div>
      </aside>

      <section id="workspace">
        <div id="ribbon" role="toolbar" aria-label="Tool options"></div>
        <div id="ocr-banner" class="banner" hidden></div>
        <div id="stage">
          <div id="viewer" tabindex="-1"><div id="pages"></div></div>
          <div id="organizer" hidden></div>
          <div id="compare" hidden></div>
          <div id="home"></div>
          <div id="pager" class="pager" hidden></div>
          <div id="drop-overlay" hidden><div>Drop to open</div></div>
        </div>
      </section>

      <aside id="assistant" hidden aria-label="AI Assistant"></aside>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
